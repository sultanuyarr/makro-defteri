<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Boy ve kilona göre günlük kalori ve makro hedefini hesaplayan, yediklerini yazdıkça kalan protein, yağ ve karbonhidratı gösteren diyet defteri.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Makro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F3ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121512" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{color-scheme:light dark}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.5 "IBM Plex Sans",system-ui,-apple-system,sans-serif;background:#F1F3ED}
@media (prefers-color-scheme:dark){body{background:#121512}}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Makro Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F1F3ED; --surface:#FFFFFF; --surface-2:#F8F9F4; --sunken:#EBEEE5;
  --ink:#151A17; --ink-2:#48524C; --muted:#78837B;
  --line:#DFE3D8; --line-2:#C9CFC0;
  --acc:#C8452B; --acc-soft:#F6E2DC;
  --pro:#2F5D82; --pro-soft:#DEE8F0;
  --fat:#B37D18; --fat-soft:#F4E9D2;
  --carb:#527D3C; --carb-soft:#E1EBD9;
  --ok:#3F7D4E; --over:#B03A22;
  --shadow:0 1px 2px rgba(21,26,23,.06), 0 8px 24px -12px rgba(21,26,23,.18);
  --r:14px;
  --ff-d:"Bricolage Grotesque","Helvetica Neue",sans-serif;
  --ff-b:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --ff-m:"IBM Plex Mono","SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121512; --surface:#1A1E1A; --surface-2:#212621; --sunken:#0D100D;
    --ink:#EBEFE8; --ink-2:#AFB8B0; --muted:#828C84;
    --line:#2B312B; --line-2:#3B433C;
    --acc:#E8654A; --acc-soft:#38211C;
    --pro:#79A8D0; --pro-soft:#1B2833;
    --fat:#DFAD4E; --fat-soft:#332A17;
    --carb:#8CBC6C; --carb-soft:#1E2A19;
    --ok:#6FB07C; --over:#E8654A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#121512; --surface:#1A1E1A; --surface-2:#212621; --sunken:#0D100D;
  --ink:#EBEFE8; --ink-2:#AFB8B0; --muted:#828C84;
  --line:#2B312B; --line-2:#3B433C;
  --acc:#E8654A; --acc-soft:#38211C;
  --pro:#79A8D0; --pro-soft:#1B2833;
  --fat:#DFAD4E; --fat-soft:#332A17;
  --carb:#8CBC6C; --carb-soft:#1E2A19;
  --ok:#6FB07C; --over:#E8654A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ff-b);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.scroll{flex:1;padding:0 16px 104px;padding-block-end:calc(104px + env(safe-area-inset-bottom,0px))}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--ff-d);font-weight:800;font-size:15px;letter-spacing:-.02em;margin-right:auto}
.brand span{color:var(--acc)}
.daynav{display:flex;align-items:center;gap:2px}
.daynav button{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--ink-2)}
.daynav button:hover{background:var(--sunken)}
.daynav button[disabled]{opacity:.28;cursor:default}
.daynav .lbl{font-size:13px;font-weight:600;min-width:104px;text-align:center;line-height:1.15}
.daynav .lbl em{display:block;font-style:normal;font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* ---------- ring block ---------- */
.hero{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.ringwrap{position:relative;width:132px;height:132px}
.ringwrap svg{width:100%;height:100%;display:block}
.ring-track{fill:none;stroke:var(--sunken);stroke-width:11}
.ring-fill{fill:none;stroke:var(--acc);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.ring-c b{font-family:var(--ff-d);font-size:34px;font-weight:800;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ring-c small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:600}
.ring-c .over{color:var(--over)}

.macros{display:flex;flex-direction:column;gap:12px}
.macro{display:grid;grid-template-columns:1fr auto;gap:3px 8px}
.macro .name{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.macro .num{font-family:var(--ff-m);font-size:11.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.macro .num b{color:var(--ink);font-weight:600}
.bar{grid-column:1/-1;height:7px;border-radius:99px;background:var(--sunken);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.m-pro .bar i{background:var(--pro)} .m-fat .bar i{background:var(--fat)} .m-carb .bar i{background:var(--carb)}
.bar.full i{background:repeating-linear-gradient(135deg,var(--over) 0 5px,color-mix(in srgb,var(--over) 62%,transparent) 5px 10px)}

.tdee-note{margin-top:10px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5}
.tdee-note b{color:var(--ink-2);font-weight:600}

/* ---------- water ---------- */
.water{display:flex;align-items:center;gap:10px;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px}
.water .wl{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.water .glasses{display:flex;gap:4px;margin-left:auto}
.water .glasses button{width:15px;height:20px;border-radius:3px 3px 6px 6px;border:1.5px solid var(--line-2);background:transparent}
.water .glasses button.on{background:var(--pro);border-color:var(--pro)}
.water .cnt{font-family:var(--ff-m);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px}

/* ---------- meals ---------- */
.meal{margin-top:16px}
.meal-h{display:flex;align-items:baseline;gap:8px;padding:0 3px 7px}
.meal-h h3{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}
.meal-h .rng{font-size:10.5px;color:var(--muted);font-family:var(--ff-m);letter-spacing:.02em}
.meal-h .tot{margin-left:auto;font-family:var(--ff-m);font-size:12px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.items{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:11px 12px 11px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .t{min-width:0}
.item .t b{display:block;font-size:14px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.item .t span{display:block;font-size:11.5px;color:var(--muted);font-family:var(--ff-m);margin-top:2px}
.item .kc{font-family:var(--ff-d);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.item .kc em{font-style:normal;font-size:10px;font-weight:600;color:var(--muted);margin-left:2px}
.item .del{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.item .del:hover{background:var(--acc-soft);color:var(--acc)}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:14px;text-align:center;font-size:12.5px;color:var(--muted)}

.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{border:1px solid var(--line-2);border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:500;background:var(--surface);color:var(--ink-2)}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- bottom nav + fab ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;max-width:480px;margin:0 auto;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.nav button.on{color:var(--acc)}
.nav svg{width:20px;height:20px}
.fab{position:fixed;z-index:31;right:max(16px,calc(50vw - 240px + 16px));bottom:calc(74px + env(safe-area-inset-bottom,0px));height:50px;padding:0 20px;border-radius:99px;background:var(--acc);color:#fff;font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:7px;box-shadow:0 6px 20px -6px color-mix(in srgb,var(--acc) 70%,transparent)}
.fab svg{width:17px;height:17px}

/* ---------- sheet ---------- */
.veil{position:fixed;inset:0;z-index:40;background:rgba(10,14,11,.5);opacity:0;pointer-events:none;transition:opacity .22s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:none;max-height:92dvh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:translateY(0)}
.sheet-h{padding:12px 16px 0;flex-shrink:0}
.grab{width:34px;height:4px;border-radius:99px;background:var(--line-2);margin:0 auto 12px}
.sheet-t{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sheet-t h2{margin:0;font-family:var(--ff-d);font-size:19px;font-weight:700;letter-spacing:-.02em}
.sheet-t .x{margin-left:auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);background:var(--sunken)}
.tabs{display:flex;gap:4px;background:var(--sunken);padding:3px;border-radius:10px;margin-bottom:12px}
.tabs button{flex:1;padding:7px 4px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.09)}
.sheet-b{overflow-y:auto;padding:0 16px 20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}

.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.inp{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px}
.inp:focus{border-color:var(--acc);outline:none}
textarea.inp{resize:vertical;min-height:84px;line-height:1.5}
.btn{width:100%;background:var(--acc);color:#fff;border-radius:11px;padding:13px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:var(--sunken);color:var(--ink)}
.res{border-top:1px solid var(--line)}
.res button{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 2px;border-bottom:1px solid var(--line)}
.res button:hover{background:var(--surface-2)}
.res .t b{display:block;font-size:14.5px;font-weight:600}
.res .t span{display:block;font-size:11.5px;color:var(--muted);font-family:var(--ff-m);margin-top:2px}
.res .k{font-family:var(--ff-d);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.nores{padding:18px 2px;font-size:13px;color:var(--muted);text-align:center;line-height:1.6}

.prev{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.prev .pn{font-size:15.5px;font-weight:700;margin-bottom:9px;line-height:1.3}
.prev .pg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.prev .pg div{background:var(--surface);border-radius:8px;padding:7px 2px}
.prev .pg b{display:block;font-family:var(--ff-d);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.prev .pg span{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:1px}
.prev .pg .c-k b{color:var(--acc)} .prev .pg .c-p b{color:var(--pro)} .prev .pg .c-f b{color:var(--fat)} .prev .pg .c-c b{color:var(--carb)}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.pick button{padding:9px 2px;border:1px solid var(--line-2);border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface)}
.pick button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rowg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rowg4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 12px}
.err{background:var(--acc-soft);color:var(--over);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin-bottom:12px}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.aitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.aitem input[type=checkbox]{width:19px;height:19px;accent-color:var(--acc)}
.aitem .t b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.aitem .t span{display:block;font-size:11px;color:var(--muted);font-family:var(--ff-m);margin-top:2px}
.aitem .k{font-family:var(--ff-d);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- pages ---------- */
.ph{font-family:var(--ff-d);font-size:24px;font-weight:800;letter-spacing:-.03em;margin:18px 0 3px}
.psub{font-size:13px;color:var(--muted);margin:0 0 16px;line-height:1.55}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h4{margin:0 0 11px;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;text-align:center}
.tgrid div{background:var(--surface-2);border-radius:10px;padding:10px 2px}
.tgrid b{display:block;font-family:var(--ff-d);font-size:19px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tgrid span{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:2px}
.tgrid .c-k b{color:var(--acc)} .tgrid .c-p b{color:var(--pro)} .tgrid .c-f b{color:var(--fat)} .tgrid .c-c b{color:var(--carb)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--muted)}
.kv b{font-family:var(--ff-m);font-weight:600;font-variant-numeric:tabular-nums}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:none}
.hrow .d{font-family:var(--ff-m);font-size:11.5px;color:var(--muted);min-width:48px}
.hbar{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden}
.hbar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.hbar i.under{background:var(--ok)}
.hrow .v{font-family:var(--ff-m);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.hrow .v em{font-style:normal;color:var(--muted);font-weight:500}
.wchart{margin-top:4px}
.wchart svg{width:100%;height:110px;display:block;overflow:visible}
.wg{stroke:var(--line);stroke-width:1}
.wline{fill:none;stroke:var(--carb);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.warea{fill:var(--carb-soft)}
.wdot{fill:var(--carb)}
.wlab{font-family:var(--ff-m);font-size:9px;fill:var(--muted)}
.flexrow{display:flex;gap:8px}
.flexrow .inp{flex:1}
.flexrow .btn{width:auto;padding:0 18px;flex-shrink:0}
.seg{display:grid;gap:6px}
.seg button{text-align:left;padding:11px 13px;border:1px solid var(--line-2);border-radius:11px;background:var(--surface)}
.seg button.on{border-color:var(--acc);background:var(--acc-soft)}
.seg button b{display:block;font-size:14px;font-weight:600}
.seg button span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.seg button.on span{color:var(--ink-2)}
.warnbox{background:var(--fat-soft);border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.55;color:var(--ink-2);margin-top:10px}
.foot{text-align:center;font-size:11px;color:var(--muted);line-height:1.6;padding:20px 8px 0}
</style>
</head>
<body>
<div class="app">
  <div class="top" id="top"></div>
  <div class="scroll" id="main"></div>
</div>
<nav class="nav" id="nav"></nav>
<button class="fab" id="fab" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Ekle</button>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Yemek ekle">
  <div class="sheet-h" id="sheetH"></div>
  <div class="sheet-b" id="sheetB"></div>
</div>

<script>
"use strict";
/* ======================= yemek veritabanı =======================
   [ad, kcal/100g, protein/100g, yağ/100g, karb/100g, porsiyon(g), porsiyon adı] */
const FOODS=[
["Yumurta (haşlanmış)",155,13,11,1.1,50,"1 adet"],
["Yumurta (sahanda)",220,12,18,0.6,55,"1 adet"],
["Beyaz peynir (tam yağlı)",280,17.5,23,1.5,30,"1 dilim"],
["Beyaz peynir (light)",185,19,11,2,30,"1 dilim"],
["Kaşar peyniri",375,25,29,2,30,"1 dilim"],
["Tulum peyniri",340,22,27,1.5,30,"1 porsiyon"],
["Lor peyniri",98,11,4,3.5,50,"2 yemek kaşığı"],
["Süt (tam yağlı)",64,3.2,3.5,4.8,200,"1 su bardağı"],
["Süt (yarım yağlı)",47,3.4,1.6,4.8,200,"1 su bardağı"],
["Yoğurt (tam yağlı)",68,3.6,4,4.5,200,"1 kase"],

const GUNLER=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];

/* ======================= yardımcılar ======================= */
const $=s=>document.querySelector(s);
const r0=n=>Math.round(n);
const r1=n=>Math.round(n*10)/10;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function norm(s){return String(s).toLocaleLowerCase("tr").replace(/ı/g,"i").replace(/İ/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").replace(/â/g,"a").replace(/î/g,"i");}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function bugun(){return iso(new Date());}
function parseIso(s){const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c);}
function kaydir(s,n){const d=parseIso(s);d.setDate(d.getDate()+n);return iso(d);}
function gunEtiket(s){
  const d=parseIso(s),t=bugun();
  if(s===t)return{b:"Bugün",e:d.getDate()+" "+AYLAR[d.getMonth()]};
  if(s===kaydir(t,-1))return{b:"Dün",e:d.getDate()+" "+AYLAR[d.getMonth()]};
  if(s===kaydir(t,1))return{b:"Yarın",e:d.getDate()+" "+AYLAR[d.getMonth()]};
  return{b:d.getDate()+" "+AYLAR[d.getMonth()],e:GUNLER[d.getDay()]};
}
function varsayilanOgun(){const h=new Date().getHours();return h<11?"kahvalti":h<16?"ogle":h<21?"aksam":"ara";}
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};

/* ======================= hedef hesabı ======================= */
function hedefler(p){
  const bmr=p.cinsiyet==="erkek"
    ? 10*p.kilo+6.25*p.boy-5*p.yas+5
    : 10*p.kilo+6.25*p.boy-5*p.yas-161;
  const tdee=bmr*AKTIVITE[p.aktivite].m;
  const acik=p.hiz*1100;
  const taban=p.cinsiyet==="erkek"?1500:1200;
  let kcal=r0(tdee-acik);
  const kisitlandi=kcal<taban;
  if(kisitlandi)kcal=taban;
  // Protein ihtiyacı toplam kiloyla değil yağsız kütleyle orantılıdır:
  // fazla kilolarda fazlalığın yalnızca %40'ı sayılır.
  const bm=p.boy/100, ustSinir=25*bm*bm;
  const refKg=p.kilo>ustSinir?ustSinir+0.4*(p.kilo-ustSinir):p.kilo;
  const protein=Math.min(r0(refKg*(p.hiz>0?1.9:1.6)),r0(kcal*0.4/4));
  const kalanK=kcal-protein*4;
  let yag=Math.max(r0(kcal*0.27/9),r0(refKg*0.7));
  const yagTavan=r0((kalanK-120)/9);
  if(yagTavan>0&&yag>yagTavan)yag=yagTavan;
  const karb=Math.max(30,r0((kalanK-yag*9)/4));
  return{bmr:r0(bmr),tdee:r0(tdee),acik:r0(acik),kcal,protein,yag,karb,kisitlandi,taban};
}


/* ======================= durum + depolama ======================= */
const state={profil:null,tarih:bugun(),gun:null,sayfa:"bugun",hazir:false};
let DB=null,SAMPLE=null,SAMPLE_IMG=false;

function bosGun(t){return{tarih:t,ogeler:[],su:0,updatedAt:0};}
function gunYukle(t){const g=LS.get("md.gun."+t,null);return g&&Array.isArray(g.ogeler)?g:bosGun(t);}
function gunKaydet(g){
  g.updatedAt=Date.now();
  LS.set("md.gun."+g.tarih,g);
  if(DB){DB.doc("gunler/"+g.tarih).set(JSON.parse(JSON.stringify(g))).catch(()=>{});}
}
function profilKaydet(p){
  p.updatedAt=Date.now();
  state.profil=p;LS.set("md.profil",p);
  if(DB){DB.doc("profil/ana").set(JSON.parse(JSON.stringify(p))).catch(()=>{});}
}

async function baglan(){
  if(!(window.claude&&typeof window.claude.use==="function"))return;
  try{DB=await window.claude.use("db");}catch(e){DB=null;}
  try{SAMPLE=await window.claude.use("sample");}catch(e){SAMPLE=null;}
  if(SAMPLE){try{const l=await SAMPLE.limits();SAMPLE_IMG=!!(l&&l.images);}catch(e){SAMPLE_IMG=false;}}
  if(DB){
    try{
      const ps=await DB.doc("profil/ana").get();
      const uzak=ps.exists?ps.data():null, yerel=state.profil;
      if(uzak&&uzak.kilo&&(!yerel||(uzak.updatedAt||0)>(yerel.updatedAt||0))){
        state.profil=JSON.parse(JSON.stringify(uzak));LS.set("md.profil",state.profil);
      }else if(yerel){DB.doc("profil/ana").set(JSON.parse(JSON.stringify(yerel))).catch(()=>{});}
    }catch(e){}
    try{
      const qs=await DB.collection("gunler").get();
      qs.docs.forEach(d=>{
        const v=d.data();if(!v||!v.tarih)return;
        const y=LS.get("md.gun."+v.tarih,null);
        if(!y||(v.updatedAt||0)>(y.updatedAt||0))LS.set("md.gun."+v.tarih,JSON.parse(JSON.stringify(v)));
      });
    }catch(e){}
    state.gun=gunYukle(state.tarih);
  }
  ciz();
}

/* ======================= toplamlar ======================= */
function toplam(ogeler){
  return ogeler.reduce((a,o)=>({kcal:a.kcal+o.kcal,p:a.p+o.p,f:a.f+o.f,c:a.c+o.c}),{kcal:0,p:0,f:0,c:0});
}

function ciz(){
  if(!state.profil){cizKurulum();return;}
  $("#nav").hidden=false;
  cizNav();
  if(state.sayfa==="bugun")cizBugun();
  else if(state.sayfa==="gecmis")cizGecmis();
  else cizProfil();
}

function hedefKart(h){
  return '<div class="tgrid">'+
    '<div class="c-k"><b>'+h.kcal+'</b><span>kcal</span></div>'+
    '<div class="c-p"><b>'+h.protein+'</b><span>protein g</span></div>'+
    '<div class="c-f"><b>'+h.yag+'</b><span>yağ g</span></div>'+
    '<div class="c-c"><b>'+h.karb+'</b><span>karb g</span></div>'+
  '</div>'+
  '<p class="hint" style="margin:10px 0 0">Protein, kilo verirken kas kaybını azaltacak düzeyde tutuldu. Yağ hormon sağlığı için gereken en az miktarın üstünde; kalan kalori karbonhidrata ayrıldı.</p>'+
  (h.kisitlandi?'<div class="warnbox"><b>Not:</b> Seçtiğin hız günlük '+h.taban+' kcal alt sınırının altına iniyordu. Hedefi '+h.taban+' kcal\'de tuttum; daha hızlı vermek istiyorsan hareketi artırmak daha güvenli.</div>':'');
}

function hesapIc(h){
  return '<div class="kv"><span>Bazal metabolizma (BMR)</span><b>'+h.bmr+' kcal</b></div>'+
    '<div class="kv"><span>Hareketle birlikte yakım</span><b>'+h.tdee+' kcal</b></div>'+
    '<div class="kv"><span>Günlük açık</span><b>−'+h.acik+' kcal</b></div>'+
    '<div class="kv"><span>Kalori hedefi</span><b>'+h.kcal+' kcal</b></div>';
}
function hedefTazele(p){
  const h=hedefler(p);
  const k=document.getElementById("hedefKart");
  if(k){const b=k.querySelector("h4").outerHTML;k.innerHTML=b+hedefKart(h);}
  const c=document.getElementById("hesapKart");
  if(c)c.innerHTML='<h4>Hesabın nasıl çıktı</h4>'+hesapIc(h);
}

/* ---------- bugün ---------- */
function cizBugun(){
  const g=state.gun,h=hedefler(state.profil),t=toplam(g.ogeler);
  const et=gunEtiket(state.tarih);
  const ileri=state.tarih>=bugun();
  $("#top").innerHTML=
    '<div class="top-row"><div class="brand">Makro <span>Defteri</span></div>'+
    '<div class="daynav">'+
      '<button data-gun="-1" aria-label="Önceki gün"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>'+
      '<div class="lbl">'+esc(et.b)+'<em>'+esc(et.e)+'</em></div>'+
      '<button data-gun="1" aria-label="Sonraki gün" '+(ileri?"disabled":"")+'><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>'+
    '</div></div>';

  const kalan=h.kcal-t.kcal, oran=Math.min(t.kcal/h.kcal,1), C=2*Math.PI*52;
  const asti=kalan<0;
  let html=
   '<div class="hero">'+
    '<div class="ringwrap"><svg viewBox="0 0 120 120" aria-hidden="true">'+
      '<circle class="ring-track" cx="60" cy="60" r="52"/>'+
      '<circle class="ring-fill" cx="60" cy="60" r="52" transform="rotate(-90 60 60)" style="stroke-dasharray:'+C.toFixed(1)+';stroke-dashoffset:'+(C*(1-oran)).toFixed(1)+(asti?';stroke:var(--over)':'')+'"/>'+
    '</svg><div class="ring-c"><b class="'+(asti?"over":"")+'">'+Math.abs(r0(kalan))+'</b><small>'+(asti?"kcal aştın":"kcal kaldı")+'</small></div></div>'+
    '<div class="macros">'+
      makroBar("pro","Protein",t.p,h.protein)+
      makroBar("fat","Yağ",t.f,h.yag)+
      makroBar("carb","Karbonhidrat",t.c,h.karb)+
    '</div>'+
   '</div>'+
   '<div class="tdee-note">Hedef <b>'+h.kcal+' kcal</b> · alınan <b>'+r0(t.kcal)+'</b> · günlük yakım ~<b>'+h.tdee+'</b></div>';

  html+='<div class="water"><div class="wl">Su</div><div class="cnt">'+(g.su*250/1000).toFixed(2).replace(".",",")+' L</div><div class="glasses">'+
    Array.from({length:8},(_,i)=>'<button data-su="'+(i+1)+'" class="'+(i<g.su?"on":"")+'" aria-label="'+(i+1)+'. bardak"></button>').join("")+
    '</div></div>';

  OGUNLER.forEach(o=>{
    const list=g.ogeler.filter(x=>x.ogun===o.id),ot=toplam(list);
    html+='<section class="meal"><div class="meal-h"><h3>'+o.ad+'</h3><span class="rng">'+o.rng+'</span>'+
      (list.length?'<span class="tot">'+r0(ot.kcal)+' kcal</span>':'')+'</div>';
    if(!list.length){
      html+='<div class="empty">Henüz bir şey eklemedin</div>';
    }else{
      html+='<div class="items">'+list.map(x=>
        '<div class="item"><div class="t"><b>'+esc(x.ad)+'</b><span>'+r0(x.gram)+' g · P '+r1(x.p)+' · Y '+r1(x.f)+' · K '+r1(x.c)+'</span></div>'+
        '<div class="kc">'+r0(x.kcal)+'<em>kcal</em></div>'+
        '<button class="del" data-sil="'+x.id+'" aria-label="Sil"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>').join("")+'</div>';
    }
    html+='</section>';
  });

  if(!g.ogeler.length){
    html+='<div style="margin-top:18px"><div class="meal-h"><h3>Hızlı ekle</h3></div><div class="quick">'+
      ["Yumurta (haşlanmış)","Beyaz peynir (tam yağlı)","Tam buğday ekmeği","Yoğurt (tam yağlı)","Tavuk göğsü (ızgara)","Mercimek çorbası","Pirinç pilavı","Elma","Çay (şekersiz)"]
      .map(ad=>'<button class="chip" data-hizli="'+esc(ad)+'">'+esc(ad.replace(/ \(.*\)/,""))+'</button>').join("")+'</div></div>';
  }
  html+='<p class="foot">Değerler ortalama tahminlerdir; marka ve pişirme yöntemine göre değişir.</p>';
  $("#main").innerHTML=html;
  $("#main").scrollTop=0;
}

function makroBar(k,ad,alinan,hedef){
  const y=Math.min(alinan/hedef,1)*100, dolu=alinan>hedef*1.02;
  const kalan=hedef-alinan;
  return '<div class="macro m-'+k+'"><div class="name">'+ad+'</div>'+
    '<div class="num"><b>'+r0(alinan)+'</b> / '+hedef+' g'+(kalan>0?' · '+r0(kalan)+' kaldı':'')+'</div>'+
    '<div class="bar'+(dolu?" full":"")+'"><i style="width:'+y.toFixed(1)+'%"></i></div></div>';
}

/* ---------- geçmiş ---------- */
function cizGecmis(){
  const h=hedefler(state.profil);
  $("#top").innerHTML='<div class="top-row"><div class="brand">Makro <span>Defteri</span></div></div>';
  const gunler=[];
  for(let i=0;i<14;i++){const t=kaydir(bugun(),-i);const g=LS.get("md.gun."+t,null);gunler.push({t,g});}
  const dolu=gunler.filter(x=>x.g&&x.g.ogeler&&x.g.ogeler.length);
  const ort=dolu.length?r0(dolu.reduce((a,x)=>a+toplam(x.g.ogeler).kcal,0)/dolu.length):0;
  const ortP=dolu.length?r0(dolu.reduce((a,x)=>a+toplam(x.g.ogeler).p,0)/dolu.length):0;

  let html='<h1 class="ph">Geçmiş</h1><p class="psub">Son 14 gün. Tek bir günün sapması önemli değil, önemli olan haftalık ortalama.</p>';

  html+='<div class="card"><h4>Kayıtlı '+dolu.length+' günün ortalaması</h4><div class="tgrid" style="grid-template-columns:1fr 1fr">'+
    '<div class="c-k"><b>'+ort+'</b><span>kcal / gün</span></div>'+
    '<div class="c-p"><b>'+ortP+'</b><span>protein g / gün</span></div>'+
  '</div>'+
  (dolu.length?'<div class="kv" style="margin-top:10px"><span>Hedefe göre</span><b>'+(ort<=h.kcal?"−":"+")+Math.abs(ort-h.kcal)+' kcal</b></div>':'')+
  '</div>';

  html+='<div class="card"><h4>Günlük kalori</h4>';
  if(!dolu.length){
    html+='<p class="hint" style="margin:0">Henüz kayıt yok. Bugün yediklerini eklemeye başla, birkaç gün sonra burada eğilimi göreceksin.</p>';
  }else{
    const maks=Math.max(h.kcal,...dolu.map(x=>toplam(x.g.ogeler).kcal))*1.05;
    html+=gunler.map(x=>{
      const et=gunEtiket(x.t),kc=x.g?r0(toplam(x.g.ogeler).kcal):0;
      if(!kc)return '<div class="hrow"><div class="d">'+esc(et.b.length>7?et.b.slice(0,6):et.b)+'</div><div class="hbar"></div><div class="v"><em>—</em></div></div>';
      return '<div class="hrow"><div class="d">'+esc(et.b.length>7?et.b.slice(0,6):et.b)+'</div>'+
        '<div class="hbar"><i class="'+(kc<=h.kcal?"under":"")+'" style="width:'+(kc/maks*100).toFixed(1)+'%"></i></div>'+
        '<div class="v">'+kc+' <em>/ '+h.kcal+'</em></div></div>';
    }).join("");
  }
  html+='</div>';

  const kl=(state.profil.kilolar||[]).slice().sort((a,b)=>a.t<b.t?-1:1);
  html+='<div class="card"><h4>Kilo takibi</h4>'+kiloGrafik(kl)+
    '<div class="flexrow" style="margin-top:12px"><input class="inp" type="number" inputmode="decimal" step="0.1" id="yeniKilo" placeholder="'+r1(state.profil.kilo)+'" aria-label="Bugünkü kilo"><button class="btn" id="kiloEkle">Kaydet</button></div>'+
    '<p class="hint" style="margin:9px 0 0">Sabah, tuvaletten sonra, aç karnına tart. Günlük dalgalanma normaldir.</p></div>';

  $("#main").innerHTML=html;
}

function kiloGrafik(kl){
  if(kl.length<2)return '<p class="hint" style="margin:0">'+(kl.length?'İlk kaydın: <b>'+r1(kl[0].kg)+' kg</b>. İkinci ölçümden sonra eğilim grafiği burada çıkar.':'Henüz kilo kaydın yok. Aşağıdan ekle.')+'</p>';
  const W=320,H=100,pad={l:30,r:8,t:10,b:18};
  const vals=kl.map(x=>x.kg),mn=Math.min(...vals),mx=Math.max(...vals);
  const alt=Math.floor(mn*2)/2-0.5,ust=Math.ceil(mx*2)/2+0.5,ar=ust-alt;
  const px=i=>pad.l+(kl.length===1?0:i/(kl.length-1))*(W-pad.l-pad.r);
  const py=v=>pad.t+(1-(v-alt)/ar)*(H-pad.t-pad.b);
  const pts=kl.map((x,i)=>px(i).toFixed(1)+","+py(x.kg).toFixed(1)).join(" ");
  const alan="M"+px(0).toFixed(1)+","+(H-pad.b).toFixed(1)+" L"+pts.split(" ").join(" L")+" L"+px(kl.length-1).toFixed(1)+","+(H-pad.b).toFixed(1)+" Z";
  const ilkT=parseIso(kl[0].t),sonT=parseIso(kl[kl.length-1].t);
  const fark=r1(kl[kl.length-1].kg-kl[0].kg);
  return '<div class="wchart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Kilo eğilimi grafiği">'+
    '<line class="wg" x1="'+pad.l+'" y1="'+py(ust)+'" x2="'+(W-pad.r)+'" y2="'+py(ust)+'"/>'+
    '<line class="wg" x1="'+pad.l+'" y1="'+py(alt)+'" x2="'+(W-pad.r)+'" y2="'+py(alt)+'"/>'+
    '<text class="wlab" x="0" y="'+(py(ust)+3)+'">'+r1(ust)+'</text>'+
    '<text class="wlab" x="0" y="'+(py(alt)+3)+'">'+r1(alt)+'</text>'+
    '<path class="warea" d="'+alan+'"/>'+
    '<polyline class="wline" points="'+pts+'"/>'+
    '<circle class="wdot" cx="'+px(kl.length-1).toFixed(1)+'" cy="'+py(kl[kl.length-1].kg).toFixed(1)+'" r="4"/>'+
    '<text class="wlab" x="'+pad.l+'" y="'+(H-4)+'">'+ilkT.getDate()+" "+AYLAR[ilkT.getMonth()].slice(0,3)+'</text>'+
    '<text class="wlab" x="'+(W-pad.r)+'" y="'+(H-4)+'" text-anchor="end">'+sonT.getDate()+" "+AYLAR[sonT.getMonth()].slice(0,3)+'</text>'+
  '</svg></div>'+
  '<div class="kv"><span>Toplam değişim</span><b style="color:'+(fark<=0?"var(--ok)":"var(--fat)")+'">'+(fark>0?"+":"")+String(fark).replace(".",",")+' kg</b></div>'+
  '<div class="kv"><span>Son ölçüm</span><b>'+String(r1(kl[kl.length-1].kg)).replace(".",",")+' kg</b></div>';
}

/* ======================= sheet (ekle) ======================= */
const sheet={acik:false,sekme:"ara",arama:"",secili:null,gram:0,ogun:"ara",ai:[],aiYuk:false,aiHata:"",serbest:"",foto:null};
function sheetAc(){
  sheet.acik=true;sheet.sekme="ara";sheet.arama="";sheet.secili=null;sheet.ai=[];sheet.aiHata="";sheet.serbest="";sheet.foto=null;
  sheet.ogun=varsayilanOgun();
  cizSheet();
  $("#veil").classList.add("on");$("#sheet").classList.add("on");
  setTimeout(()=>{const el=$("#q");if(el)el.focus();},260);
}
function sheetKapat(){
  sheet.acik=false;
  $("#veil").classList.remove("on");$("#sheet").classList.remove("on");
}
function cizSheet(){
  const sekmeler=[["ara","Ara"]];
  if(SAMPLE)sekmeler.push(["yaz","Yaz"]);
  if(SAMPLE&&SAMPLE_IMG)sekmeler.push(["foto","Fotoğraf"]);
  sekmeler.push(["elle","Elle"]);
  $("#sheetH").innerHTML='<div class="grab"></div><div class="sheet-t"><h2>Ne yedin?</h2>'+
    '<button class="x" id="sheetX" aria-label="Kapat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>'+
    '<div class="tabs">'+sekmeler.map(([id,ad])=>'<button data-sek="'+id+'" class="'+(sheet.sekme===id?"on":"")+'">'+ad+'</button>').join("")+'</div>';
  let b="";
  if(sheet.secili)b=cizPorsiyon();
  else if(sheet.sekme==="ara")b=cizAra();
  else if(sheet.sekme==="yaz")b=cizYaz();
  else if(sheet.sekme==="foto")b=cizFoto();
  else b=cizElle();
  $("#sheetB").innerHTML=b;
}
function ogunSec(){
  return '<div class="fld"><span>Hangi öğün</span><div class="pick" style="margin-bottom:0">'+
    OGUNLER.map(o=>'<button data-ogun="'+o.id+'" class="'+(sheet.ogun===o.id?"on":"")+'">'+o.ad+'</button>').join("")+'</div></div>';
}
function cizAra(){
  const q=norm(sheet.arama.trim());
  let liste;
  if(!q)liste=FOODS.slice(0,12);
  else{
    const s=FOODS.map(f=>{const n=norm(f[0]);let p=-1;
      if(n.startsWith(q))p=0;else if(n.includes(" "+q))p=1;else if(n.includes(q))p=2;
      return p<0?null:{f,p};}).filter(Boolean).sort((a,b)=>a.p-b.p||a.f[0].length-b.f[0].length);
    liste=s.slice(0,30).map(x=>x.f);
  }
  return '<label class="fld"><span>Yemek ara</span><input class="inp" id="q" type="search" autocomplete="off" placeholder="mercimek çorbası, yumurta, simit…" value="'+esc(sheet.arama)+'"></label>'+
    (liste.length?'<div class="res">'+liste.map(f=>{
      const kc=r0(f[1]*f[5]/100);
      return '<button data-yemek="'+esc(f[0])+'"><div class="t"><b>'+esc(f[0])+'</b><span>'+esc(f[6])+' · '+f[5]+' g</span></div><div class="k">'+kc+'</div></button>';
    }).join("")+'</div>'
    :'<div class="nores">"'+esc(sheet.arama)+'" listede yok.<br>'+(SAMPLE?'<b>Yaz</b> sekmesinden tarif ederek ekleyebilirsin.':'<b>Elle</b> sekmesinden değerleri girebilirsin.')+'</div>');
}
function cizPorsiyon(){
  const f=sheet.secili,g=sheet.gram;
  const kc=f[1]*g/100,p=f[2]*g/100,y=f[3]*g/100,k=f[4]*g/100;
  const katlar=[0.5,1,1.5,2];
  return '<div class="prev"><div class="pn">'+esc(f[0])+'</div><div class="pg">'+
      '<div class="c-k"><b>'+r0(kc)+'</b><span>kcal</span></div>'+
      '<div class="c-p"><b>'+r1(p)+'</b><span>protein</span></div>'+
      '<div class="c-f"><b>'+r1(y)+'</b><span>yağ</span></div>'+
      '<div class="c-c"><b>'+r1(k)+'</b><span>karb</span></div>'+
    '</div></div>'+
    '<div class="fld"><span>Porsiyon — '+esc(f[6])+' ≈ '+f[5]+' g</span><div class="pick" style="margin-bottom:0">'+
      katlar.map(x=>'<button data-kat="'+x+'" class="'+(Math.abs(g-f[5]*x)<0.5?"on":"")+'">'+String(x).replace(".",",")+'x</button>').join("")+
    '</div></div>'+
    '<label class="fld"><span>Miktar (gram)</span><input class="inp" id="gram" type="number" inputmode="numeric" value="'+r0(g)+'" min="1" max="3000"></label>'+
    ogunSec()+
    '<button class="btn" id="ekleBtn">Deftere ekle</button>'+
    '<button class="btn ghost" id="geriBtn" style="margin-top:8px">Geri</button>';
}
function cizYaz(){
  if(sheet.aiYuk)return yukleniyor("Claude öğününü çözümlüyor…","Bu 10-30 saniye sürebilir.");
  if(sheet.ai.length)return aiSonuc();
  return '<p class="hint">Ne yediğini normal cümlelerle yaz — Claude porsiyonları ve makroları tahmin etsin.</p>'+
    (sheet.aiHata?'<div class="err">'+esc(sheet.aiHata)+'</div>':'')+
    '<label class="fld"><span>Öğünün</span><textarea class="inp" id="serbest" placeholder="2 dilim tam buğday ekmeği, 1 haşlanmış yumurta, biraz beyaz peynir ve 5-6 zeytin">'+esc(sheet.serbest)+'</textarea></label>'+
    ogunSec()+
    '<button class="btn" id="aiBtn">Hesapla</button>';
}
function cizFoto(){
  if(sheet.aiYuk)return yukleniyor("Claude tabağına bakıyor…","Bu 15-40 saniye sürebilir.");
  if(sheet.ai.length)return aiSonuc();
  return '<p class="hint">Tabağının fotoğrafını çek; Claude içindekileri ve tahmini porsiyonları çıkarsın. Yanında bir çatal ya da bardak varsa tahmin daha isabetli olur.</p>'+
    (sheet.aiHata?'<div class="err">'+esc(sheet.aiHata)+'</div>':'')+
    '<label class="fld"><span>Fotoğraf</span><input class="inp" id="fotoInp" type="file" accept="image/*" capture="environment"></label>'+
    (sheet.foto?'<div class="prev"><div class="pn" style="margin:0;font-size:13.5px;font-weight:500">'+esc(sheet.foto.name||"Fotoğraf seçildi")+'</div></div>':'')+
    ogunSec()+
    '<button class="btn" id="fotoBtn" '+(sheet.foto?"":"disabled")+'>Çözümle</button>';
}
function yukleniyor(b,a){
  return '<div style="text-align:center;padding:36px 10px">'+
    '<div style="width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px"></div>'+
    '<div style="font-size:14.5px;font-weight:600">'+esc(b)+'</div>'+
    '<div style="font-size:12.5px;color:var(--muted);margin-top:5px">'+esc(a)+'</div></div>';
}
function aiSonuc(){
  const sec=sheet.ai.filter(x=>x.on);
  const t=sec.reduce((a,x)=>({k:a.k+x.kcal,p:a.p+x.protein,f:a.f+x.yag,c:a.c+x.karb}),{k:0,p:0,f:0,c:0});
  return '<div class="prev"><div class="pn" style="font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)">Seçilenlerin toplamı</div><div class="pg">'+
      '<div class="c-k"><b>'+r0(t.k)+'</b><span>kcal</span></div>'+
      '<div class="c-p"><b>'+r1(t.p)+'</b><span>protein</span></div>'+
      '<div class="c-f"><b>'+r1(t.f)+'</b><span>yağ</span></div>'+
      '<div class="c-c"><b>'+r1(t.c)+'</b><span>karb</span></div>'+
    '</div></div>'+
    sheet.ai.map((x,i)=>'<label class="aitem"><input type="checkbox" data-ai="'+i+'" '+(x.on?"checked":"")+'>'+
      '<div class="t"><b>'+esc(x.ad)+'</b><span>'+r0(x.gram)+' g · P '+r1(x.protein)+' · Y '+r1(x.yag)+' · K '+r1(x.karb)+'</span></div>'+
      '<div class="k">'+r0(x.kcal)+'</div></label>').join("")+
    '<p class="hint" style="margin-top:12px">Bunlar tahmindir. Yanlış görünen bir şey varsa işaretini kaldır, sonra <b>Elle</b> sekmesinden düzelt.</p>'+
    ogunSec()+
    '<button class="btn" id="aiEkle" '+(sec.length?"":"disabled")+'>'+sec.length+' öğeyi ekle</button>'+
    '<button class="btn ghost" id="aiGeri" style="margin-top:8px">Baştan</button>';
}
function cizElle(){
  return '<p class="hint">Paketin üzerindeki değerleri yaz. Kalori boş bırakılırsa makrolardan hesaplanır.</p>'+
    '<label class="fld"><span>Ne yedin</span><input class="inp" id="eAd" placeholder="Örn. Marka X protein kurabiye"></label>'+
    '<div class="rowg"><label class="fld"><span>Miktar (g)</span><input class="inp" id="eGram" type="number" inputmode="numeric" value="100"></label>'+
    '<label class="fld"><span>Kalori</span><input class="inp" id="eKcal" type="number" inputmode="numeric" placeholder="kcal"></label></div>'+
    '<div class="rowg" style="grid-template-columns:repeat(3,1fr)">'+
      '<label class="fld"><span>Protein</span><input class="inp" id="eP" type="number" inputmode="decimal" step="0.1" value="0"></label>'+
      '<label class="fld"><span>Yağ</span><input class="inp" id="eF" type="number" inputmode="decimal" step="0.1" value="0"></label>'+
      '<label class="fld"><span>Karb</span><input class="inp" id="eC" type="number" inputmode="decimal" step="0.1" value="0"></label>'+
    '</div>'+
    '<p class="hint" style="margin-top:-2px">Girdiğin değerler toplam miktar için — 100 g için değil.</p>'+
    ogunSec()+
    '<button class="btn" id="elleBtn">Deftere ekle</button>';
}

/* ======================= ekleme ======================= */
function ogeEkle(o){
  state.gun.ogeler.push(Object.assign({id:Math.random().toString(36).slice(2,10)},o));
  gunKaydet(state.gun);
  if(state.sayfa!=="bugun"){state.sayfa="bugun";cizNav();}
  cizBugun();
}
const PROMPT_KURAL='Sen Türk mutfağını iyi bilen bir beslenme uzmanısın. Türkiye\'deki standart porsiyonları baz al: 1 dilim ekmek ~25 g, 1 çay bardağı ~100 ml, 1 su bardağı ~200 ml, 1 yemek kaşığı ~15 g, 1 tatlı kaşığı ~7 g, 1 kase çorba ~250 g, 1 porsiyon pilav ~150 g, 1 dilim beyaz peynir ~30 g, 1 orta boy meyve ~150 g.\nSADECE şu biçimde bir JSON dizisi döndür, öncesinde ve sonrasında hiçbir açıklama yazma:\n[{"ad":"yiyecek adı","gram":sayı,"kcal":sayı,"protein":sayı,"yag":sayı,"karb":sayı}]\nÖnemli: kcal, protein, yag ve karb değerleri o öğenin BELİRTTİĞİN GRAM MİKTARININ TAMAMI için olsun, 100 gram için değil. Her yiyeceği ayrı bir nesne yap. Sayıları rakam olarak yaz.\nDeğerleri TürKomp ve USDA gibi standart besin tablolarına dayandır; uydurma. Kalori ile makrolar tutarlı olsun: kcal, protein*4 + yag*9 + karb*4 sonucuna yakın çıkmalı. Ev yemeklerinde kullanılan yağı da hesaba kat. Emin olmadığında ortalama bir ev porsiyonunu esas al.';

async function aiCagir(mesaj,blob){
  sheet.aiYuk=true;sheet.aiHata="";cizSheet();
  try{
    const opts={modelTier:"default"};
    if(blob)opts.images=blob;
    const veri=await SAMPLE.json(mesaj,opts);
    const liste=(Array.isArray(veri)?veri:(veri&&Array.isArray(veri.ogeler)?veri.ogeler:[]))
      .map(x=>({ad:String(x.ad||x.isim||"Bilinmeyen"),gram:Number(x.gram)||0,kcal:Number(x.kcal)||0,
                protein:Number(x.protein)||0,yag:Number(x.yag)||0,karb:Number(x.karb)||0,on:true}))
      .filter(x=>x.kcal>0||x.protein>0||x.yag>0||x.karb>0);
    if(!liste.length)throw{code:"bos"};
    sheet.ai=liste;sheet.aiYuk=false;cizSheet();
  }catch(e){
    sheet.aiYuk=false;
    const c=e&&e.code;
    sheet.aiHata=
      c==="not_granted"?"Claude'a sorma izni verilmedi. Sayfayı yenileyip tekrar deneyebilir, ya da Elle sekmesinden girebilirsin."
      :c==="rate_limited"?"Çok sık istek gönderildi. Bir dakika bekleyip tekrar dene."
      :c==="images_unavailable"?"Bu görünümde fotoğraf gönderilemiyor. Yaz sekmesini kullan."
      :c==="image_rejected"?"Fotoğraf okunamadı. Daha küçük bir JPEG veya PNG dene."
      :c==="bos"?"Yazdığından yiyecek çıkaramadım. Daha açık yaz, örneğin “1 kase mercimek çorbası ve 2 dilim ekmek”."
      :"Bağlanamadım. Tekrar dene ya da Elle sekmesinden gir.";
    cizSheet();
  }
}

/* ======================= olaylar ======================= */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,label.aitem");
  if(!t)return;

  /* --- kurulum/profil seçimleri --- */
  const f=t.dataset.f;
  if(f){
    const taslak=f[0]==="t",anahtar=f.slice(1),v=t.dataset.v;
    const hedef=taslak?state.taslak:state.profil;
    okuForm(hedef,taslak?"t":"p");
    hedef[anahtar]=(anahtar==="cinsiyet")?v:Number(v);
    if(taslak)cizKurulum();else{profilKaydet(state.profil);cizProfil();}
    return;
  }
  if(t.id==="basla"){
    const p=state.taslak;okuForm(p,"t");
    p.kilolar=[{t:bugun(),kg:p.kilo}];
    profilKaydet(p);state.taslak=null;state.sayfa="bugun";ciz();return;
  }
  if(t.id==="sifirla"){
    if(confirm("Tüm profil ve yemek kayıtların silinecek. Emin misin?")){
      Object.keys(localStorage).filter(k=>k.indexOf("md.")===0).forEach(k=>localStorage.removeItem(k));
      state.profil=null;state.gun=bosGun(state.tarih);state.taslak=null;ciz();
    }return;
  }
  if(t.id==="kiloEkle"){
    const v=parseFloat(($("#yeniKilo").value||"").replace(",","."));
    if(!(v>20&&v<400)){$("#yeniKilo").focus();return;}
    const p=state.profil;p.kilolar=(p.kilolar||[]).filter(x=>x.t!==bugun());
    p.kilolar.push({t:bugun(),kg:v});p.kilo=v;profilKaydet(p);cizGecmis();return;
  }

  /* --- gezinme --- */
  if(t.dataset.nav){state.sayfa=t.dataset.nav;ciz();return;}
  if(t.dataset.gun){
    const n=Number(t.dataset.gun),y=kaydir(state.tarih,n);
    if(n>0&&y>bugun())return;
    state.tarih=y;state.gun=gunYukle(y);cizBugun();return;
  }
  if(t.dataset.su!=null){
    const n=Number(t.dataset.su);
    state.gun.su=(state.gun.su===n)?n-1:n;gunKaydet(state.gun);cizBugun();return;
  }
  if(t.dataset.sil){
    state.gun.ogeler=state.gun.ogeler.filter(x=>x.id!==t.dataset.sil);
    gunKaydet(state.gun);cizBugun();return;
  }
  if(t.dataset.hizli){
    const y=FOODS.find(x=>x[0]===t.dataset.hizli);
    if(y){sheetAc();sheet.secili=y;sheet.gram=y[5];cizSheet();}
    return;
  }

  /* --- sheet --- */
  if(t.id==="fab"){sheetAc();return;}
  if(t.id==="sheetX"){sheetKapat();return;}
  if(t.dataset.sek){sheet.sekme=t.dataset.sek;sheet.secili=null;sheet.ai=[];sheet.aiHata="";cizSheet();return;}
  if(t.dataset.ogun){sheet.ogun=t.dataset.ogun;cizSheet();return;}
  if(t.dataset.yemek){
    const y=FOODS.find(x=>x[0]===t.dataset.yemek);
    if(y){sheet.secili=y;sheet.gram=y[5];cizSheet();}return;
  }
  if(t.dataset.kat){sheet.gram=sheet.secili[5]*Number(t.dataset.kat);cizSheet();return;}
  if(t.id==="geriBtn"){sheet.secili=null;cizSheet();return;}
  if(t.id==="ekleBtn"){
    const f2=sheet.secili,g=Math.max(1,Number($("#gram").value)||f2[5]);
    ogeEkle({ad:f2[0],gram:g,kcal:f2[1]*g/100,p:f2[2]*g/100,f:f2[3]*g/100,c:f2[4]*g/100,ogun:sheet.ogun});
    sheetKapat();return;
  }
  if(t.id==="elleBtn"){
    const ad=($("#eAd").value||"").trim()||"Kendi kaydım";
    const g=Number($("#eGram").value)||100;
    const p=Number($("#eP").value)||0,y=Number($("#eF").value)||0,c=Number($("#eC").value)||0;
    const kcal=Number($("#eKcal").value)||r0(p*4+y*9+c*4);
    if(!kcal&&!p&&!y&&!c){$("#eKcal").focus();return;}
    ogeEkle({ad,gram:g,kcal,p,f:y,c,ogun:sheet.ogun});sheetKapat();return;
  }
  if(t.id==="aiBtn"){
    const s=($("#serbest").value||"").trim();
    if(!s){$("#serbest").focus();return;}
    sheet.serbest=s;
    aiCagir(PROMPT_KURAL+"\n\nKullanıcının yediği: \""+s+"\"");
    return;
  }
  if(t.id==="fotoBtn"&&sheet.foto){
    aiCagir(PROMPT_KURAL+"\n\nEkteki fotoğrafta bir öğün var. Tabaktaki her yiyeceği ayrı ayrı belirle ve porsiyonlarını tahmin et.",sheet.foto);
    return;
  }
  if(t.id==="aiGeri"){sheet.ai=[];sheet.foto=null;cizSheet();return;}
  if(t.id==="aiEkle"){
    sheet.ai.filter(x=>x.on).forEach(x=>{
      state.gun.ogeler.push({id:Math.random().toString(36).slice(2,10),ad:x.ad,gram:x.gram,kcal:x.kcal,p:x.protein,f:x.yag,c:x.karb,ogun:sheet.ogun});
    });
    gunKaydet(state.gun);sheetKapat();
    if(state.sayfa!=="bugun"){state.sayfa="bugun";cizNav();}
    cizBugun();return;
  }
});

document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.ai!=null){
    sheet.ai[Number(el.dataset.ai)].on=el.checked;cizSheet();return;
  }
  if(el.id==="fotoInp"){
    sheet.foto=el.files&&el.files[0]?el.files[0]:null;cizSheet();return;
  }
});

document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="q"){
    sheet.arama=el.value;
    const kon=el.selectionStart;
    const b=$("#sheetB");b.innerHTML=cizAra();
    const y=$("#q");if(y){y.focus();try{y.setSelectionRange(kon,kon);}catch(_){}}
    return;
  }
  if(el.id==="gram"){
    const g=Number(el.value)||0;if(g<=0)return;
    sheet.gram=g;
    const f=sheet.secili,kc=f[1]*g/100;
    const pg=document.querySelector(".prev .pg");
    if(pg)pg.innerHTML='<div class="c-k"><b>'+r0(kc)+'</b><span>kcal</span></div>'+
      '<div class="c-p"><b>'+r1(f[2]*g/100)+'</b><span>protein</span></div>'+
      '<div class="c-f"><b>'+r1(f[3]*g/100)+'</b><span>yağ</span></div>'+
      '<div class="c-c"><b>'+r1(f[4]*g/100)+'</b><span>karb</span></div>';
    document.querySelectorAll("[data-kat]").forEach(b=>
      b.classList.toggle("on",Math.abs(g-f[5]*Number(b.dataset.kat))<0.5));
    return;
  }
  if(el.id==="serbest"){sheet.serbest=el.value;return;}

});

document.addEventListener("blur",e=>{
  const el=e.target;
  if(!el.id)return;
  if(["pyas","pboy","pkilo"].indexOf(el.id)>=0){
    okuForm(state.profil,"p");profilKaydet(state.profil);hedefTazele(state.profil);
  }else if(["tyas","tboy","tkilo"].indexOf(el.id)>=0){
    okuForm(state.taslak,"t");hedefTazele(state.taslak);
  }
},true);

function okuForm(p,pre){
  const g=id=>{const el=document.getElementById(pre+id);return el?el.value:null;};
  const yas=Number(g("yas")),boy=Number(g("boy")),kilo=parseFloat(String(g("kilo")||"").replace(",","."));
  if(yas>=14&&yas<=99)p.yas=yas;
  if(boy>=120&&boy<=230)p.boy=boy;
  if(kilo>=35&&kilo<=300)p.kilo=kilo;
}

$("#veil").addEventListener("click",sheetKapat);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet.acik)sheetKapat();});

/* ======================= ana ekrana ekleme (PWA) ======================= */
(function pwa(){
  const h=document.head;
  const m=(n,c)=>{if(document.querySelector('meta[name="'+n+'"]'))return;const el=document.createElement("meta");el.setAttribute("name",n);el.setAttribute("content",c);h.appendChild(el);};
  m("apple-mobile-web-app-capable","yes");
  m("mobile-web-app-capable","yes");
  m("apple-mobile-web-app-title","Makro");
  m("apple-mobile-web-app-status-bar-style","default");
  const koyu=matchMedia("(prefers-color-scheme: dark)").matches;
  m("theme-color",koyu?"#121512":"#F1F3ED");
  try{
    const c=document.createElement("canvas");c.width=c.height=180;
    const x=c.getContext("2d");
    x.fillStyle="#F1F3ED";x.fillRect(0,0,180,180);
    x.strokeStyle="#C8452B";x.lineWidth=13;x.lineCap="round";
    x.beginPath();x.arc(90,90,58,-Math.PI/2,Math.PI*0.95);x.stroke();
    x.fillStyle="#151A17";x.font="700 62px 'Bricolage Grotesque',sans-serif";
    x.textAlign="center";x.textBaseline="middle";x.fillText("M",90,94);
    if(document.querySelector('link[rel="apple-touch-icon"]'))return;
    const l=document.createElement("link");
    l.rel="apple-touch-icon";l.href=c.toDataURL("image/png");h.appendChild(l);
  }catch(e){}
})();

state.profil=LS.get("md.profil",null);
if(state.profil&&!state.profil.kilolar)state.profil.kilolar=[];
state.gun=gunYukle(state.tarih);
ciz();
baglan();
